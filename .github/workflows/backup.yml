# Backup diário do banco Supabase (schemas public, auth e storage).
# O dump sai criptografado com GPG (AES256) porque o repositório é público.
#
# Pra restaurar:
#   gpg -d backup_AAAA-MM-DD_HHMM.dump.gpg > backup.dump      (pede a BACKUP_PASSPHRASE)
#   pg_restore --no-owner --no-privileges -d "<url do banco>" -n public backup.dump

name: Backup do banco

on:
  schedule:
    - cron: '0 6 * * *'   # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar dump criptografado
        shell: bash
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Faltam os secrets SUPABASE_DB_URL e/ou BACKUP_PASSPHRASE"
            exit 1
          fi
          STAMP=$(TZ=America/Sao_Paulo date +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mkdir -p out
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" -Fc --no-owner --no-privileges \
            -n public -n auth -n storage -f dump.pgcustom
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-file <(printf '%s' "$PASSPHRASE") \
            -o "out/backup_${STAMP}.dump.gpg" dump.pgcustom
          rm -f dump.pgcustom
          ls -lh out

      - name: Salvar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.STAMP }}
          path: out/*.dump.gpg
          retention-days: 30
          if-no-files-found: error
