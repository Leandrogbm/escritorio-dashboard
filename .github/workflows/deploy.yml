name: Deploy pro Hostinger

# Builda e sobe dist/ direto no Hostinger via FTP toda vez que main recebe um push --
# substitui o fluxo manual de "gerar zip e subir pelo File Manager" (ver CLAUDE.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Dois pushes seguidos em main não podem rodar dois deploys em paralelo pra mesma pasta FTP
# — interfere no arquivo de estado do FTP-Deploy-Action e pode intercalar upload de builds
# diferentes. cancel-in-progress:false deixa o mais novo esperar o de antes terminar, em vez
# de cancelar um deploy potencialmente já em andamento no meio do upload.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

# Só precisa ler o repo pra buildar — nunca escreve nada nele. Reduz o que um token
# comprometido desse workflow conseguiria fazer.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # ftps (explicit, criptografado) em vez de ftp puro -- senha nunca trafega em
          # texto claro. Hostinger aceita FTPS na mesma conta de FTP normal; se a conexão
          # falhar por causa disso, trocar pra "ftp" é o único ajuste necessário.
          protocol: ftps
          local-dir: ./dist/
          # pasta de destino no Hostinger -- ajustar se o site não estiver na raiz do FTP
          # (ex.: "public_html/" ou "domains/seudominio.com/public_html/")
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # nunca apaga arquivo extra que já esteja no servidor e não veio desse build --
          # dangerous-clean-slate:true um dia apagaria algo colocado manualmente sem aviso.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
