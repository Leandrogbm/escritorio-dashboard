name: Deploy pro GitHub Pages

# Builda e publica dist/ no branch gh-pages toda vez que main recebe um push. Hostinger foi
# abandonado (conta suspensa por pagamento, domínio mysaldo.com.br migrado pra
# actumjus.com.br) — GitHub Pages é gratuito, HTTPS automático via Let's Encrypt, e não
# depende de credencial de FTP nenhuma (só o GITHUB_TOKEN que a Action já tem sozinha).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Dois pushes seguidos em main não podem publicar em paralelo (evita dois commits
# concorrentes no branch gh-pages se misturarem).
concurrency:
  group: deploy-pages
  cancel-in-progress: false

# contents:write é necessário aqui porque a Action publica fazendo commit/push no branch
# gh-pages (diferente do antigo deploy por FTP, que só lia o repo).
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publica no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # CNAME (domínio próprio) fica versionado em dist/CNAME via public/CNAME — se sumir
          # do build por engano, o GitHub Pages volta a servir só o *.github.io.
